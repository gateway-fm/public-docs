openapi: 3.0.0
info:
  title: Txpool json-rpc API
  version: 2.0.0
  description: |
    The txpool API provides methods for interacting with the transaction pool in cdk-erigon.
    These methods allow developers to inspect pending transactions, check transaction statuses,
    and understand the contents of the transaction pool.
servers:
  - url: https://rpc.stavanger.gateway.fm
paths:
  /txpool_content:
    post:
      tags:
        - Transaction Pool
      summary: txpool_content
      operationId: txpool_content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: "txpool_content"
                params:
                  type: array
                  items: {}
                  example: []
                id:
                  type: integer
                  example: 1
      responses:
        "200":
          description: Returns a detailed listing of all transactions currently in the pool
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    example: "2.0"
                  id:
                    type: integer
                    example: 1
                  result:
                    type: object
                    properties:
                      pending:
                        type: object
                        description: Map of pending transactions grouped by address
                      queued:
                        type: object
                        description: Map of queued transactions grouped by address
  /txpool_inspect:
    post:
      tags:
        - Transaction Pool
      summary: txpool_inspect
      operationId: txpool_inspect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: "txpool_inspect"
                params:
                  type: array
                  items: {}
                  example: []
                id:
                  type: integer
                  example: 1
      responses:
        "200":
          description: Returns a human-readable overview of transaction pool contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    example: "2.0"
                  id:
                    type: integer
                    example: 1
                  result:
                    type: object
                    properties:
                      pending:
                        type: object
                        description: Human-readable pending transactions grouped by address
                      queued:
                        type: object
                        description: Human-readable queued transactions grouped by address
  /txpool_status:
    post:
      tags:
        - Transaction Pool
      summary: txpool_status
      operationId: txpool_status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: "txpool_status"
                params:
                  type: array
                  items: {}
                  example: []
                id:
                  type: integer
                  example: 1
      responses:
        "200":
          description: Returns the number of transactions currently in the transaction pool
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    example: "2.0"
                  id:
                    type: integer
                    example: 1
                  result:
                    type: object
                    properties:
                      pending:
                        type: string
                        description: Number of pending transactions in hexadecimal
                        example: "0x42"
                      queued:
                        type: string
                        description: Number of queued transactions in hexadecimal
                        example: "0x13"
tags:
  - name: Transaction Pool
    description: Methods for interacting with the transaction pool
